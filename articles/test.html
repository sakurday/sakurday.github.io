<!--
为什么会这么焦虑呢...
-->

<!--
自己仔细静了静, 想了一会, 我觉得有两点原因
-->

<!--
第一点: 自己明明想进步, 但是没有动力. 总是想着大学生活努力一点, 多考高分, 拿证, 然后保研或者考验, 最后才能找好工作...结果这些最终只变成了我的理想...实际上我是能摆就摆, 逃避着各种活动, 上课半听半玩最后啥都没听到, 作业90%都是搜的, 基本没自己做过...平时的爱好对自己的前途好像也没什么用. 在这种情况下, 只要身边的人, 无论是现实中认识的人还是网友, 只要讨论到与学习/前途/上进/分数/内卷有关的内容, 都会让我有点点应激...然后就是焦虑.
-->

<!--
第二点: 过于在意别人对我的感受...可能是我爱多想吧, 只要别人和我说话的语气有一点点的..讨厌?(更准确来说, 比较"中性", 客观的没有感情), 或者别人很长时间对我冷淡(有可能是不知道怎么回我, 也有可能是真的比较忙) 我就会产生非常大的焦虑, 担心对方是不是讨厌我了...而且这种焦虑非常影响我...
-->

<!--
希望大家如果对我有什么意见, 比如我说话的方式, 或者做了什么事让你感觉不开心甚至有点反感我的, 请大胆向我说出来, 我不会因此生气的...否则, 如果我犯了啥事但是我不知道, 但是别人对我态度似乎变差了, 我真的会很焦虑...
-->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本加密与解密</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --field: #ffffff;
    --text: #15181d;
    --muted: #666e7a;
    --border: #dcdfe5;
    --accent: #2563eb;
    --accent-strong: #1d4ed8;
    --ring: rgba(37, 99, 235, 0.18);
    --hover: rgba(0, 0, 0, 0.045);
    --danger: #b42318;
    --ok: #157347;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --field: #151a21;
    --text: #e6e9ee;
    --muted: #939ca9;
    --border: #262c35;
    --accent: #3b82f6;
    --accent-strong: #2563eb;
    --ring: rgba(59, 130, 246, 0.28);
    --hover: rgba(255, 255, 255, 0.06);
    --danger: #f2685c;
    --ok: #4ec98a;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 30px 20px 64px;
  }

  /* 顶部 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* 模式切换 */
  .tabs {
    display: flex;
    gap: 26px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 26px;
  }

  .tab {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 10px 2px;
    font: inherit;
    font-size: 15px;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .tab:hover { color: var(--text); }

  .tab.is-active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  /* 表单区块 */
  .field { margin-bottom: 20px; }

  .field > label,
  .label-row label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .label-row label { margin-bottom: 0; }

  textarea,
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.55;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease,
                background-color 0.2s ease;
  }

  textarea {
    resize: vertical;
    min-height: 118px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
                 "Liberation Mono", monospace;
    font-size: 14px;
    word-break: break-all;
  }

  textarea::placeholder,
  input::placeholder { color: var(--muted); opacity: 0.8; }

  textarea:focus,
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .input-row input {
    flex: 1;
    min-width: 0;
  }

  /* 按钮 */
  .btn {
    appearance: none;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease,
                color 0.15s ease, opacity 0.15s ease;
  }

  .btn.primary {
    background: var(--accent);
    color: #ffffff;
  }

  .btn.primary:hover:not(:disabled) { background: var(--accent-strong); }

  .btn.ghost {
    background: transparent;
    border-color: var(--border);
    color: var(--text);
  }

  .btn.ghost:hover:not(:disabled) { background: var(--hover); }

  .btn.small {
    padding: 5px 11px;
    font-size: 13px;
  }

  .btn:disabled { opacity: 0.55; cursor: default; }

  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  /* 状态提示 */
  .status {
    min-height: 22px;
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--muted);
  }

  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }

  /* 页脚说明 */
  .foot {
    margin-top: 34px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
  }

  .foot p { margin: 0; }

  @media (max-width: 520px) {
    .wrap { padding: 20px 16px 48px; }
    h1 { font-size: 18px; }
    .tabs { gap: 20px; margin-bottom: 22px; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="topbar">
    <h1>文本加密与解密</h1>
    <button id="themeBtn" class="btn ghost small" type="button">深色</button>
  </header>

  <div class="tabs" role="tablist" aria-label="操作模式">
    <button class="tab is-active" type="button" role="tab"
            aria-selected="true" data-mode="encrypt">加密</button>
    <button class="tab" type="button" role="tab"
            aria-selected="false" data-mode="decrypt">解密</button>
  </div>

  <section class="field">
    <label for="inputText">输入文本</label>
    <textarea id="inputText" rows="6" spellcheck="false"
              placeholder="输入需要加密的文本……"></textarea>
  </section>

  <section class="field">
    <label for="password">口令</label>
    <div class="input-row">
      <input id="password" type="password" autocomplete="new-password"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="输入用于加密的口令">
      <button id="togglePw" class="btn ghost" type="button">显示</button>
    </div>
  </section>

  <div class="actions">
    <button id="runBtn" class="btn primary" type="button">加密</button>
    <button id="clearBtn" class="btn ghost" type="button">清空</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="field">
    <div class="label-row">
      <label for="outputText">结果</label>
      <button id="copyBtn" class="btn ghost small" type="button">复制</button>
    </div>
    <textarea id="outputText" rows="6" readonly spellcheck="false"
              placeholder="加密结果会显示在这里"></textarea>
  </section>

  <footer class="foot">
    <p>
      This page is generated by 大肥鱼
    </p>
  </footer>
</main>

<script>
(function () {
  'use strict';

  var ITERATIONS = 600000;
  var VERSION = 1;
  var SALT_LEN = 16;
  var IV_LEN = 12;
  var HEADER_LEN = 1 + SALT_LEN + IV_LEN;

  var encoder = new TextEncoder();
  var decoder = new TextDecoder();

  var inputEl = document.getElementById('inputText');
  var outputEl = document.getElementById('outputText');
  var pwEl = document.getElementById('password');
  var runBtn = document.getElementById('runBtn');
  var clearBtn = document.getElementById('clearBtn');
  var copyBtn = document.getElementById('copyBtn');
  var togglePwBtn = document.getElementById('togglePw');
  var themeBtn = document.getElementById('themeBtn');
  var statusEl = document.getElementById('status');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  var mode = 'encrypt';
  var busy = false;

  /* ---------- 主题 ---------- */

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '浅色' : '深色';
    try { localStorage.setItem('theme', theme); } catch (e) {}
  }

  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved !== 'dark' && saved !== 'light') {
      saved = window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light';
    }
    applyTheme(saved);
  })();

  themeBtn.addEventListener('click', function () {
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  /* ---------- 编码工具 ---------- */

  function bytesToBase64(bytes) {
    var binary = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToBytes(text) {
    var clean = text.replace(/\s+/g, '');
    var binary;
    try {
      binary = atob(clean);
    } catch (e) {
      throw new Error('密文格式无效，请检查是否完整复制');
    }
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      out[i] = binary.charCodeAt(i);
    }
    return out;
  }

  /* ---------- 加解密核心 ---------- */

  function deriveKey(password, salt) {
    return crypto.subtle.importKey(
      'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
    ).then(function (baseKey) {
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    });
  }

  function encryptText(plainText, password) {
    var salt = crypto.getRandomValues(new Uint8Array(SALT_LEN));
    var iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
    var key;

    return deriveKey(password, salt).then(function (k) {
      key = k;
      return crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv }, key, encoder.encode(plainText)
      );
    }).then(function (cipherBuffer) {
      var cipher = new Uint8Array(cipherBuffer);
      var out = new Uint8Array(HEADER_LEN + cipher.length);
      out[0] = VERSION;
      out.set(salt, 1);
      out.set(iv, 1 + SALT_LEN);
      out.set(cipher, HEADER_LEN);
      return bytesToBase64(out);
    });
  }

  function decryptText(cipherText, password) {
    var data = base64ToBytes(cipherText);

    if (data.length <= HEADER_LEN || data[0] !== VERSION) {
      return Promise.reject(new Error('数据格式不正确，无法解密'));
    }

    var salt = data.slice(1, 1 + SALT_LEN);
    var iv = data.slice(1 + SALT_LEN, HEADER_LEN);
    var cipher = data.slice(HEADER_LEN);

    return deriveKey(password, salt).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipher);
    }).then(function (plainBuffer) {
      return decoder.decode(plainBuffer);
    }, function () {
      throw new Error('解密失败：口令错误或数据已被篡改');
    });
  }

  /* ---------- 界面状态 ---------- */

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function idleLabel() {
    return mode === 'encrypt' ? '加密' : '解密';
  }

  function setBusy(value) {
    busy = value;
    runBtn.disabled = value;
    runBtn.textContent = value
      ? (mode === 'encrypt' ? '加密中……' : '解密中……')
      : idleLabel();
  }

  function setMode(next) {
    if (mode === next || busy) return;
    mode = next;

    tabs.forEach(function (tab) {
      var active = tab.dataset.mode === mode;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });

    runBtn.textContent = idleLabel();
    inputEl.placeholder = mode === 'encrypt'
      ? '输入需要加密的文本……'
      : '粘贴需要解密的密文……';
    outputEl.placeholder = mode === 'encrypt'
      ? '加密结果（Base64 文本）会显示在这里'
      : '解密后的明文会显示在这里';
    pwEl.placeholder = mode === 'encrypt'
      ? '输入用于加密的口令'
      : '输入解密口令';

    outputEl.value = '';
    setStatus('');
  }

  /* ---------- 交互 ---------- */

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      setMode(tab.dataset.mode);
    });
  });

  togglePwBtn.addEventListener('click', function () {
    var isPassword = pwEl.type === 'password';
    pwEl.type = isPassword ? 'text' : 'password';
    togglePwBtn.textContent = isPassword ? '隐藏' : '显示';
  });

  function run() {
    if (busy) return;

    if (!window.crypto || !window.crypto.subtle) {
      setStatus('当前环境不支持 Web Crypto，请使用 HTTPS 或本地文件方式打开', 'error');
      return;
    }

    var text = inputEl.value;
    var password = pwEl.value;

    if (!text.trim()) {
      setStatus(mode === 'encrypt' ? '请先输入要加密的文本' : '请先粘贴要解密的密文', 'error');
      inputEl.focus();
      return;
    }

    if (!password) {
      setStatus('请输入口令', 'error');
      pwEl.focus();
      return;
    }

    outputEl.value = '';
    setBusy(true);
    setStatus(mode === 'encrypt' ? '正在加密……' : '正在解密……');

    var task = mode === 'encrypt'
      ? encryptText(text, password)
      : decryptText(text, password);

    task.then(function (result) {
      outputEl.value = result;
      setStatus(mode === 'encrypt' ? '加密完成' : '解密完成', 'ok');
    }).catch(function (err) {
      setStatus(err && err.message ? err.message : '操作失败', 'error');
    }).then(function () {
      setBusy(false);
    });
  }

  runBtn.addEventListener('click', run);

  clearBtn.addEventListener('click', function () {
    if (busy) return;
    inputEl.value = '';
    outputEl.value = '';
    pwEl.value = '';
    pwEl.type = 'password';
    togglePwBtn.textContent = '显示';
    setStatus('');
    inputEl.focus();
  });

  copyBtn.addEventListener('click', function () {
    var text = outputEl.value;
    if (!text) {
      setStatus('没有可复制的内容', 'error');
      return;
    }

    function fallback() {
      outputEl.removeAttribute('readonly');
      outputEl.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) { done = false; }
      outputEl.setAttribute('readonly', 'readonly');
      window.getSelection().removeAllRanges();
      setStatus(done ? '已复制到剪贴板' : '复制失败，请手动选中复制', done ? 'ok' : 'error');
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus('已复制到剪贴板', 'ok');
      }, fallback);
    } else {
      fallback();
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      run();
    }
  });

  /* ---------- 初始化 ---------- */

  setMode('encrypt');
  setBusy(false);

  if (!window.crypto || !window.crypto.subtle) {
    setStatus('当前环境不支持 Web Crypto，请使用 HTTPS 或本地文件方式打开', 'error');
  }
})();
</script>
</body>
</html>
